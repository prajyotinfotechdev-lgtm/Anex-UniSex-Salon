services:
  - type: web
    name: anex-api
    env: node
    buildCommand: pnpm install && pnpm build --filter api
    startCommand: cd apps/api && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: anex-admin
    env: node
    buildCommand: pnpm install && pnpm build --filter admin && cp -r apps/admin/public apps/admin/.next/standalone/apps/admin/public && cp -r apps/admin/.next/static apps/admin/.next/standalone/apps/admin/.next/static
    startCommand: node apps/admin/.next/standalone/apps/admin/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: web
    name: anex-customer
    env: node
    buildCommand: pnpm install && pnpm build --filter customer && cp -r apps/customer/public apps/customer/.next/standalone/apps/customer/public && cp -r apps/customer/.next/static apps/customer/.next/standalone/apps/customer/.next/static
    startCommand: node apps/customer/.next/standalone/apps/customer/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: cron
    name: anex-marketing-daily
    env: node
    schedule: "0 10 * * *"
    buildCommand: "echo 'No build needed for cron'"
    startCommand: "curl -X GET -H \"Authorization: Bearer ${CRON_SECRET}\" ${CUSTOMER_APP_URL}/api/cron/marketing-daily"
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: CUSTOMER_APP_URL
        sync: false

  - type: cron
    name: anex-marketing-weekly
    env: node
    schedule: "0 15 * * 5"
    buildCommand: "echo 'No build needed for cron'"
    startCommand: "curl -X GET -H \"Authorization: Bearer ${CRON_SECRET}\" ${CUSTOMER_APP_URL}/api/cron/marketing-weekly"
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: CUSTOMER_APP_URL
        sync: false
